extend = "../../pyproject.toml"

# override the api ban, while preserving all other ban rules
[lint.flake8-tidy-imports.banned-api]
"asyncio" = {msg = "To handle async operations, use the scheduling module's callbacks. See ulauncher.utils.subprocess_utils."}
"gi.repository" = {msg = "GObject introspection was removed in the Qt rewrite. Use PySide6 / ulauncher.utils.qdbus."}
"ulauncher.ui" = {msg = "Import ulauncher.ui only from ulauncher/cli/commands - it pulls in Qt and must not leak into extension runtime."}
"functools.lru_cache" = {msg = "Use ulauncher.utils.lru_cache instead to preserve parameter types."}
"functools.cache" = {msg = "Use ulauncher.utils.lru_cache instead to preserve parameter types."}
"functools.cached_property" = {msg = "cached_property erases property types. If you need to use this, create a typed wrapper similar to ulauncher.utils.lru_cache"}
"threading" = {msg = "Avoid threading. Use callbacks scheduled on the event loop when possible"}

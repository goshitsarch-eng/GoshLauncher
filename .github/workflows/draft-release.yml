name: Draft release

on:
  push:
    tags:
      - "*"

jobs:
  draft_release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Qt 6 runtime and deb build tools
        run: |
          sudo bash scripts/ci-install-qt6.sh
          sudo apt-get install -y --no-install-recommends debhelper dh-python python3-all help2man
      - name: Set up virtual environment
        run: make venv
      - name: Check
        run: make check
      - name: Generate release notes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .venv/bin/git-cliff --current > RELEASE_NOTES.md
      - name: Build release
        run: |
          VERSION=$(make version)
          echo "Building GoshLauncher version: $VERSION"
          make deb DEB_DISTRO=jammy
          # make sure to run make sdist after make deb because make deb overwrites the tarball
          make sdist

      - name: Make draft GitHub release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.deb

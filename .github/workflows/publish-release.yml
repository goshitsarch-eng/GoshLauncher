name: Publish release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt 6 runtime and packaging tools
        run: |
          sudo bash scripts/ci-install-qt6.sh
          sudo apt-get install -y --no-install-recommends \
            debhelper dh-python python3-all python3-setuptools \
            devscripts dput gnupg help2man
      # GoshLauncher is a fork. It must never upload to Ulauncher's PPA or AUR package: those
      # belong to upstream, and a build of this fork appearing there would be a hijack. Set the
      # repository variables below to this fork's own channels to enable publishing.
      - name: Publish to Launchpad
        if: ${{ vars.LAUNCHPAD_PPA != '' }}
        env:
          LAUNCHPAD_SSH_TAR: ${{ secrets.LAUNCHPAD_SSH_TAR }}
          LAUNCHPAD_PUB_KEY: ${{ secrets.LAUNCHPAD_PUB_KEY }}
          LAUNCHPAD_SECRET_KEY: ${{ secrets.LAUNCHPAD_SECRET_KEY }}
          GPGKEY: ${{ secrets.DEB_GPGKEY }}
          PPA: ${{ vars.LAUNCHPAD_PPA }}
          PPA_PRERELEASE: ${{ vars.LAUNCHPAD_PPA_PRERELEASE }}
        shell: bash
        run: |
          echo "Ref type: $GITHUB_REF_TYPE"
          VERSION=$(make version)
          echo "Version: $VERSION"
          # a prerelease goes to the separate dev PPA when one is configured
          if [[ "$VERSION" == *-* && -n "$PPA_PRERELEASE" ]]; then PPA="$PPA_PRERELEASE"; fi
          echo "PPA: $PPA"
          echo -n "$LAUNCHPAD_SSH_TAR" | base64 -d > scripts/launchpad.ssh.tar
          echo -n "$LAUNCHPAD_PUB_KEY" | base64 -d > scripts/launchpad-public.key
          echo -n "$LAUNCHPAD_SECRET_KEY" | base64 -d > scripts/launchpad-secret.key
          tar -xvf scripts/launchpad.ssh.tar -C /
          gpg --import "scripts/launchpad-public.key"
          gpg --import "scripts/launchpad-secret.key"
          # noble    24.04 LTS EOL 2029-06
          # jammy    22.04 LTS EOL 2027-06
          # questing 25.10     EOL 2026-07
          # resolute 26.04 LTS EOL 2031-06
          for DISTRO in $(echo "noble jammy questing resolute"); do
            DEB_VERSION="$(echo $VERSION | tr "-" "~")-0ubuntu1ppa1~${DISTRO}"
            make deb DEB_VERSION="${DEB_VERSION}" DEB_DISTRO="${DISTRO}" DPKG_ARGS="--post-clean --build=source -sa --sign-key=${GPGKEY}"
            echo "Uploading to launchpad PPA:${PPA}"
            dput -f "ppa:${PPA}" dist/*.changes
            rm dist/*
          done;

      - name: Publish to AUR
        if: ${{ !contains(github.ref_name, '-') && vars.AUR_PACKAGE_NAME != '' }}
        uses: friday/aur-publish-action@master
        with:
          new_release: ${{ github.ref_name }}
          package_name: ${{ vars.AUR_PACKAGE_NAME }}
          commit_username: "GoshLauncher"
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_PRIVATE_KEY }}
